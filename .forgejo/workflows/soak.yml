name: soak

# The 50-minute soak (project `soak`, e2e/soak/) on demand, in CI, so it never needs a developer machine. It
# never runs on main and has no schedule. Start it with workflow_dispatch (input `minutes`; empty means the full 50
# minutes) or by pushing a `ci/soak*` branch. A push runs a short check of the test, 3 minutes, unless the branch name
# ends in `-full` (full run) or `-<n>m` (n minutes), e.g. `ci/soak-check-10m`. The job is e2e.yml's (same pinned
# Playwright image, /tmp on tmpfs, relay in a docker-in-docker service), with a timeout above the full run's 70. No build step (the project's web server builds).

# Quoted "on": YAML 1.1 tools read the bare word as the boolean true.
"on":
  push:
    branches: ["ci/soak*"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak length in minutes (empty: the full 50)"
        required: false
        default: ""

# A newer push to a ci/soak* branch cancels that branch's older run; a dispatch is never cancelled (each has its own
# group), nor does it cancel anything.
concurrency:
  group: retrobrew-soak-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    shell: bash

jobs:
  soak:
    runs-on: docker
    timeout-minutes: 90
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    container:
      image: mcr.microsoft.com/playwright@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host --tmpfs /tmp:rw,exec,size=4g
    services:
      dind:
        image: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      CI: "true"
      DOCKER_HOST: tcp://dind:2375
      E2E_RELAY_UPSTREAM: dind:17777
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Empty means the full run. Branch names are passed through the environment, never interpolated into the script.
      - name: length
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MINUTES: ${{ github.event.inputs.minutes }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          minutes=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            minutes="$INPUT_MINUTES"
          elif [[ "$REF_NAME" == *-full ]]; then
            minutes=""
          elif [[ "$REF_NAME" =~ -([0-9]+)m$ ]]; then
            minutes="${BASH_REMATCH[1]}"
          else
            minutes=3
          fi
          [[ -z "$minutes" || "$minutes" =~ ^[0-9]+$ ]] || { echo "minutes must be a number" >&2; exit 1; }
          [[ -z "$minutes" || "$minutes" -le 70 ]] || { echo "minutes must be 70 or fewer (the job times out at 90)" >&2; exit 1; }
          echo "E2E_SOAK_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo "soak length: ${minutes:-50 (full)} minutes"

      - name: docker cli
        run: |
          curl -fsSL -o /tmp/docker.tgz https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz
          echo "40c16bcf324f354b382d07e845e6a79e3493fc0c09b252dff9e1a46125589bff  /tmp/docker.tgz" | sha256sum -c -
          tar xzf /tmp/docker.tgz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null

      - name: relay
        run: |
          set -euo pipefail
          image=$(sed -n "s/^export const RELAY_IMAGE = '\(.*\)';$/\1/p" e2e/relay/settings.ts)
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "no pinned relay image in e2e/relay/settings.ts" >&2; exit 1; }
          docker create --name retrobrew-e2e-relay --publish 17777:8080 "$image"
          docker cp e2e/relay/nostr-rs-relay.toml retrobrew-e2e-relay:/usr/src/app/config.toml
          docker start retrobrew-e2e-relay

      - name: install
        run: npm ci

      - name: soak
        run: npm run test:soak

      - name: relay log
        if: failure()
        run: docker logs --tail 50 retrobrew-e2e-relay || true
