# Included in every location that serves content. nginx does not inherit add_header into a
# location that sets its own, so each location includes this file after its Cache-Control.
# $retrobrew_csp comes from the map in nginx.conf: the app may reach the relays, nothing else may.
add_header Content-Security-Policy $retrobrew_csp always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
