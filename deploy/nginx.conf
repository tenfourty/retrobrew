# Serves the static build (dist/) for https://retrobrew.app from nginx-unprivileged:
# the landing page at /, the guide at /lean-coffee/ and the app at /app/.
# Board state lives in the URL #fragment, which never reaches this server, so there is
# no SPA fallback. No access log: we keep nothing about who joined.
#
# The security headers live in one include, used by every location that serves content.

# Each page gets only what it needs. The app talks to the relays and may use data: images; the landing page,
# the guide and everything else load images from this origin only and connect to nothing at all. The directory
# fallback to /app/index.html keeps a /app/ URI, so the app page gets the app policy. An error_page 404 does not:
# its internal redirect makes $uri /404.html, so even a 404 under /app/ carries the default policy.
map $uri $retrobrew_csp {
    ~^/app/  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://relay.primal.net wss://nostr.mom wss://relay.snort.social wss://relay.nostr.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    default  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log off;
    server_tokens off;

    # Behind the tunnel nginx sees plain http; never leak :8080 or an internal host in a redirect.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Browsers keep the #fragment across a redirect whose Location has none, so /app#start still works.
    location = /app {
        include /etc/nginx/retrobrew/security-headers.conf;
        return 301 /app/;
    }

    location = /lean-coffee {
        include /etc/nginx/retrobrew/security-headers.conf;
        return 301 /lean-coffee/;
    }

    # A made-up address gets the small Retrobrew page in public/404.html, still with status 404, not nginx's bare one.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/retrobrew/security-headers.conf;
    }

    # Browsers ask for /favicon.ico whatever the page's <link rel="icon"> says (and always on a page that has none).
    location = /favicon.ico {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/retrobrew/security-headers.conf;
        try_files /favicon.png =404;
    }

    # Vite puts a content hash in every asset name, so assets never change in place. No `always`
    # on Cache-Control: a 404 during a deploy must not be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/retrobrew/security-headers.conf;
        try_files $uri =404;
    }

    # Everything else (the pages, version.txt, robots.txt, the icons and the two small scripts)
    # keeps its name across deploys, so browsers check for a new copy every time.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/retrobrew/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
